server {
    listen 80;

    location /api/users/ {
        proxy_pass http://user-service:3001/;
    }

    location /api/products/ {
        proxy_pass http://product-service:3002/;
    }

    location /api/orders/ {
        proxy_pass http://order-service:3003/;
    }

    location = /health {
        return 200 "Nginx is healthy";
    }
}
