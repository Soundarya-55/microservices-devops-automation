services:

  user-service:
    build: ./services/user-service
    container_name: user-service
    restart: unless-stopped
    expose:
      - "3001"
    networks:
      - app-network

  product-service:
    build: ./services/product-service
    container_name: product-service
    restart: unless-stopped
    expose:
      - "3002"
    networks:
      - app-network

  order-service:
    build: ./services/order-service
    container_name: order-service
    restart: unless-stopped
    expose:
      - "3003"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - user-service
      - product-service
      - order-service
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
